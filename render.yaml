services:
  - type: web
    name: pomelli-wrapper
    runtime: docker
    dockerfilePath: ./Dockerfile.render
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      # /tmp/outputs is writable on Render; files are ephemeral between restarts.
      # Completed runs are uploaded to Supabase Storage automatically.
      - key: OUTPUTS_DIR
        value: /tmp/outputs
      # Paste the output of:
      #   node -e "console.log(require('fs').readFileSync('google-session.json').toString('base64'))"
      - key: GOOGLE_SESSION_B64
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SECRET_KEY
        sync: false
      - key: SUPABASE_BUCKET
        value: runs
